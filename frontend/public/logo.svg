<svg width="160" height="50" viewBox="0 0 160 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="160" height="50" fill="rgba(0,0,0,0.1)" rx="25"/>
  
  <!-- Om Symbol Circle Background -->
  <circle cx="25" cy="25" r="18" fill="rgba(255,215,0,0.15)" stroke="url(#logoGradient)" stroke-width="1.5"/>
  
  <!-- Om Symbol -->
  <text x="25" y="32" font-family="serif" font-size="20" fill="url(#logoGradient)" font-weight="bold" text-anchor="middle" filter="url(#glow)">ॐ</text>
  
  <!-- Spiritual Text -->
  <text x="55" y="32" font-family="Arial, sans-serif" font-size="20" fill="url(#logoGradient)" font-weight="bold" filter="url(#glow)">Spiritual</text>
  
</svg>